# \u2500\u2500 Server \u2500\u2500
server.port=8080
spring.application.name=postkaro-api

# \u2500\u2500 Database \u2500\u2500
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postkaro}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# \u2500\u2500 JWT \u2500\u2500
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.access-token-expiry=900000
app.jwt.refresh-token-expiry=604800000

# \u2500\u2500 Meta OAuth \u2500\u2500
meta.ig.app.id=${META_APP_ID:}
meta.ig.app.secret=${META_APP_SECRET:}
instagram.app.id=${INSTAGRAM_APP_ID:}
instagram.app.secret=${INSTAGRAM_APP_SECRET:}
meta.fb.config-id=${META_FB_CONFIG_ID:}

# \u2500\u2500 CORS \u2500\u2500
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}

# \u2500\u2500 AI providers \u2500\u2500
openai.api.key=${OPENAI_API_KEY:}
fal.api.key=${FAL_API_KEY:}
sarvam.api-key=${SARVAM_API_KEY:}

# \u2500\u2500 Media \u2500\u2500
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# \u2500\u2500 Admin \u2500\u2500
app.admin.token=${APP_ADMIN_TOKEN:}

# \u2500\u2500 Email notifications (Resend HTTP API \u2014 Railway blocks SMTP ports) \u2500\u2500
app.resend.api-key=${RESEND_API_KEY:}
app.notify.from=${NOTIFY_FROM:onboarding@resend.dev}
app.notify.to=${NOTIFY_TO:}

# \u2500\u2500 Logging \u2500\u2500
logging.level.in.postkaro=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN