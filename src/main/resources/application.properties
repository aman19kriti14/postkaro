# ── Server ──
server.port=8080
spring.application.name=postkaro-api

# ── Database ──
spring.datasource.url=jdbc:postgresql://localhost:5432/postkaro
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT ──
app.jwt.secret=abcd
app.jwt.access-token-expiry=900000
app.jwt.refresh-token-expiry=604800000

# Meta OAuth
meta.ig.app.id=${META_APP_ID:1713782503325497}
meta.ig.app.secret=${META_APP_SECRET:33ed6a4b273ebf327f81813056586c8e}
instagram.app.id=${INSTAGRAM_APP_ID:1460592875515881}
instagram.app.secret=${INSTAGRAM_APP_SECRET:2c057ddb567af9188e9c3cc1fa071894}
meta.fb.config-id=${META_FB_CONFIG_ID:2053667335283468}

# ── CORS ──
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:5173

openai.api.key=${OPENAI_API_KEY:}

fal.api.key=${FAL_API_KEY:}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ── Logging ──
logging.level.in.postkaro=DEBUG
logging.level.org.springframework.security=DEBUG
