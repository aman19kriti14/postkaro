# ── Server ──
server.port=8080
spring.application.name=postkaro-api

# ── Database ──
spring.datasource.url=jdbc:postgresql://localhost:5432/postkaro
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT ──
app.jwt.secret=abcd
app.jwt.access-token-expiry=900000
app.jwt.refresh-token-expiry=604800000

# ── CORS ──
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:5173

# ── Logging ──
logging.level.in.postkaro=DEBUG
logging.level.org.springframework.security=DEBUG
